# Isolated lifecycle experiment only. No production target references this spec.
name: iCTRLNonUIExperiment
options:
  bundleIdPrefix: com.openminis
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  iCTRLNonUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iCTRLNonUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openminis.ictrl.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        USES_XCTRUNNER: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Isolated non-UI XCTest lifecycle experiment serving JSONRPC on the local network."

schemes:
  iCTRLNonUI:
    build:
      targets:
        iCTRLNonUITests: [test]
    test:
      targets:
        - iCTRLNonUITests
      testPlans: []
      preferredScreenCaptureFormat: screenshots
      captureScreenshotsAutomatically: false
