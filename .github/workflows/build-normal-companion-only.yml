name: Build normal iCTRL Companion only

on:
  push:
    branches:
      - owner-arm-ui-20261114
      - owner-arm-authoritative-refresh-20261117
      - owner-lifecycle-client-wiring-20261119

permissions:
  contents: read

jobs:
  companion-only:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Verify ZERO-XCTEST lifecycle source
        run: |
          grep -F 'func reconcileCompanionService()' iCTRLApp/Models/AppState.swift
          grep -F 'OwnerControlCredentialStore.ensure(baseURL: baseURL)' iCTRLApp/Models/AppState.swift
          grep -F 'static func ensure(baseURL raw: String)' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'appState.startCompanionService()' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.stopCompanionService()' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.startCompanionService()' iCTRLApp/Views/MainView.swift
          grep -F 'appState.stopCompanionService()' iCTRLApp/Views/MainView.swift
          ! grep -F 'appState.startServer()' iCTRLApp/Views/SettingsView.swift
          ! grep -F 'appState.stopServer()' iCTRLApp/Views/SettingsView.swift
          ! grep -F 'appState.startServer()' iCTRLApp/Views/MainView.swift
          ! grep -F 'appState.stopServer()' iCTRLApp/Views/MainView.swift
          grep -F 'appState.setApplicationActive(phase == .active)' iCTRLApp/iCTRLApp.swift
          grep -F 'case "recovery_pairing_gate":' iCTRLApp/Models/AppState.swift
          grep -F 'Label("Owner ARM", systemImage: "power.circle.fill")' iCTRLApp/Views/SettingsView.swift
          grep -F 'Label("Owner OFF", systemImage: "stop.circle.fill")' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.startOwnerControl()' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.stopOwnerControl()' iCTRLApp/Views/SettingsView.swift
          grep -F 'guard self.appIsActive, self.isServerRunning else {' iCTRLApp/Models/AppState.swift
          grep -F 'let deviceID = NearbyIdentity.deviceID' iCTRLApp/Models/AppState.swift
          grep -F 'RemotePairingEndpointOracle.resolve()' iCTRLApp/Models/AppState.swift
          ! grep -A35 -F 'case "recovery_pairing_gate":' iCTRLApp/Models/AppState.swift | grep -F 'startOwnerControl()'

      - name: Owner authority zero-phone state and wiring tests
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts/owner_authority_state_zero_phone.swift /tmp/main.swift
          swiftc iCTRLApp/Models/OwnerAuthorityStatus.swift /tmp/main.swift -o /tmp/owner-authority-state-test
          /tmp/owner-authority-state-test
          grep -F 'func status(completion: @escaping (Result<OwnerAuthorityStatus, Error>) -> Void)' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'request.httpMethod = "GET"' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'request.setValue(credential.identity, forHTTPHeaderField: "X-Owner-Identity")' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'func service(_ action: OwnerServiceAction' iCTRLApp/Models/OwnerControlClient.swift
          grep -F '.appendingPathComponent(endpoint)' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'let executionReady = obj["execution_ready"] as? Bool' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'let serviceState = obj["service_state"] as? String' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'client.service(.start)' iCTRLApp/Models/AppState.swift
          grep -F 'client.service(.stop)' iCTRLApp/Models/AppState.swift
          grep -F 'Text("Service")' iCTRLApp/Views/SettingsView.swift
          grep -F 'Text("Execution Ready")' iCTRLApp/Views/SettingsView.swift
          python3 - <<'PY'
          from pathlib import Path
          src = Path("iCTRLApp/Models/AppState.swift").read_text()
          start = src[src.index("func startCompanionService()"):src.index("/// Explicit Owner ARM ingress.")]
          stop = src[src.index("func stopCompanionService()"):src.index("/// Explicit Owner ARM ingress.")]
          assert start.index("startServer()") < start.index("client.service(.start)")
          assert stop.index("client.service(.stop)") < stop.index("self.stopServer()")
          assert "Service remains locally running." in stop
          reconcile = src[src.index("func reconcileCompanionService()"):src.index("private func scheduleServerRestartIfNeeded()")]
          assert "client.service" not in reconcile
          print("PASS explicit service lifecycle source ordering")
          PY
          grep -F 'func refreshOwnerAuthorityStatus()' iCTRLApp/Models/AppState.swift
          grep -F 'scheduleOwnerAuthorityRefreshIfNeeded()' iCTRLApp/Models/AppState.swift
          grep -F 'self.refreshOwnerAuthorityStatus()' iCTRLApp/Models/AppState.swift
          grep -F 'ownerAuthorityState = .unknown' iCTRLApp/Models/AppState.swift
          grep -F 'Text("UNKNOWN").foregroundColor(.orange)' iCTRLApp/Views/SettingsView.swift
          grep -F 'Refresh Owner Status' iCTRLApp/Views/SettingsView.swift
          grep -F 'http://127.0.0.1:\(port)/whoami' iCTRLApp/Models/RunnerStatus.swift
          ! grep -A45 -F 'func refreshOwnerAuthorityStatus()' iCTRLApp/Models/AppState.swift | grep -E 'client\.(arm|off)'
          ! grep -A12 -F 'private func scheduleOwnerAuthorityRefreshIfNeeded()' iCTRLApp/Models/AppState.swift | grep -E 'startOwnerControl|stopOwnerControl|client\.(arm|off)'
          grep -A18 -F '// A failed read must never preserve a stale ARMED display.' iCTRLApp/Models/AppState.swift | grep -F 'ownerAuthorityState = .unknown'
          grep -A16 -F 'func setApplicationActive(_ active: Bool)' iCTRLApp/Models/AppState.swift | grep -F 'refreshOwnerAuthorityStatus()'
          grep -B8 -A10 -F 'self.refreshOwnerAuthorityStatus()' iCTRLApp/Models/AppState.swift | grep -F 'if running {'

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and fetch framework
        run: |
          bash Scripts/fetch-idevice.sh
          xcodegen generate --quiet
          ./Scripts/stamp-build.sh

      - name: Build normal Companion target only
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_PREFIX="$(sed -nE 's/^ICTRL_BUNDLE_PREFIX[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' Config/Signing.xcconfig)"
          OUT="$PWD/build/companion-only"
          mkdir -p "$OUT"
          xcodebuild build \
            -project iCTRL.xcodeproj \
            -target iCTRL \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ICTRL_BUNDLE_PREFIX="$BUNDLE_PREFIX" \
            ARCHS=arm64 \
            CONFIGURATION_BUILD_DIR="$OUT/Debug-iphoneos" \
            SYMROOT="$OUT" \
            OBJROOT="$OUT/obj"
          test -d "$OUT/Debug-iphoneos/iCTRL.app"
          if find "$OUT" -name 'iCTRLUITests-Runner.app' -o -name '*.xctest' | grep -q .; then
            echo "Runner/XCTest artifact unexpectedly produced"
            exit 1
          fi

      - name: Package only normal iCTRL.ipa
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/companion-only/Debug-iphoneos/iCTRL.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          codesign --force --sign - "$APP"
          rm -rf "$PWD/build/companion-only/package"
          mkdir -p "$PWD/build/companion-only/package/Payload"
          cp -R "$APP" "$PWD/build/companion-only/package/Payload/"
          cd "$PWD/build/companion-only/package"
          zip -qr "$GITHUB_WORKSPACE/iCTRL.ipa" Payload/
          cd "$GITHUB_WORKSPACE"
          unzip -l iCTRL.ipa | tee /tmp/ipa-list.txt
          if grep -E 'iCTRLUITests-Runner|\.xctest|XCTest\.framework' /tmp/ipa-list.txt; then
            echo "Runner/XCTest content found in normal Companion IPA"
            exit 1
          fi
          shasum -a 256 iCTRL.ipa

      - name: Upload normal Companion IPA only
        uses: actions/upload-artifact@v4
        with:
          name: iCTRL-normal-companion-recovery-fix
          path: iCTRL.ipa
          if-no-files-found: error
          retention-days: 14
