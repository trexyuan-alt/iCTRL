name: Build normal iCTRL Companion only

on:
  push:
    branches:
      - remotepairing-recovery-gate-20261114

permissions:
  contents: read

jobs:
  companion-only:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Verify ZERO-XCTEST lifecycle source
        run: |
          grep -F 'func reconcileCompanionService()' iCTRLApp/Models/AppState.swift
          grep -F 'OwnerControlCredentialStore.ensure(baseURL: baseURL)' iCTRLApp/Models/AppState.swift
          grep -F 'static func ensure(baseURL raw: String)' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'appState.startServer()' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.stopServer()' iCTRLApp/Views/SettingsView.swift
          ! grep -F 'appState.startOwnerControl()' iCTRLApp/Views/SettingsView.swift
          ! grep -F 'appState.stopOwnerControl()' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.setApplicationActive(phase == .active)' iCTRLApp/iCTRLApp.swift
          grep -F 'case "recovery_pairing_gate":' iCTRLApp/Models/AppState.swift
          grep -F 'guard self.appIsActive, self.isServerRunning else {' iCTRLApp/Models/AppState.swift
          grep -F 'let deviceID = NearbyIdentity.deviceID' iCTRLApp/Models/AppState.swift
          grep -F 'RemotePairingEndpointOracle.resolve()' iCTRLApp/Models/AppState.swift
          ! grep -A35 -F 'case "recovery_pairing_gate":' iCTRLApp/Models/AppState.swift | grep -F 'startOwnerControl()'

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and fetch framework
        run: |
          bash Scripts/fetch-idevice.sh
          xcodegen generate --quiet
          ./Scripts/stamp-build.sh

      - name: Build normal Companion target only
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_PREFIX="$(sed -nE 's/^ICTRL_BUNDLE_PREFIX[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' Config/Signing.xcconfig)"
          OUT="$PWD/build/companion-only"
          mkdir -p "$OUT"
          xcodebuild build \
            -project iCTRL.xcodeproj \
            -target iCTRL \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ICTRL_BUNDLE_PREFIX="$BUNDLE_PREFIX" \
            ARCHS=arm64 \
            CONFIGURATION_BUILD_DIR="$OUT/Debug-iphoneos" \
            SYMROOT="$OUT" \
            OBJROOT="$OUT/obj"
          test -d "$OUT/Debug-iphoneos/iCTRL.app"
          if find "$OUT" -name 'iCTRLUITests-Runner.app' -o -name '*.xctest' | grep -q .; then
            echo "Runner/XCTest artifact unexpectedly produced"
            exit 1
          fi

      - name: Package only normal iCTRL.ipa
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/companion-only/Debug-iphoneos/iCTRL.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          codesign --force --sign - "$APP"
          rm -rf "$PWD/build/companion-only/package"
          mkdir -p "$PWD/build/companion-only/package/Payload"
          cp -R "$APP" "$PWD/build/companion-only/package/Payload/"
          cd "$PWD/build/companion-only/package"
          zip -qr "$GITHUB_WORKSPACE/iCTRL.ipa" Payload/
          cd "$GITHUB_WORKSPACE"
          unzip -l iCTRL.ipa | tee /tmp/ipa-list.txt
          if grep -E 'iCTRLUITests-Runner|\.xctest|XCTest\.framework' /tmp/ipa-list.txt; then
            echo "Runner/XCTest content found in normal Companion IPA"
            exit 1
          fi
          shasum -a 256 iCTRL.ipa

      - name: Upload normal Companion IPA only
        uses: actions/upload-artifact@v4
        with:
          name: iCTRL-normal-companion-recovery-fix
          path: iCTRL.ipa
          if-no-files-found: error
          retention-days: 14
