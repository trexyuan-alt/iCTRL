name: Build unsigned iCTRL Runner

on:
  push:
    branches:
      - iphone-endpoint-oracle-20261102
      - zero-xctest-companion-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runner:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: ZERO-XCTEST production source guard
        shell: bash
        run: |
          if grep -R -n -E '^import XCTest$' iCTRLApp iCTRLKit; then
            echo "XCTest import found in production Companion sources"
            exit 1
          fi
          if grep -F 'ictrl://start' iCTRLApp/Views/SettingsView.swift; then
            echo "Production UI still launches XCTest Runner"
            exit 1
          fi
          if grep -F 'iCTRLUITests-Runner' iCTRLApp/Views/SettingsView.swift; then
            echo "Production UI still depends on XCTest Runner"
            exit 1
          fi
          grep -F '"get_current_remotepairing_endpoint"' iCTRLApp/Models/AppState.swift
          grep -F '"device_info"' iCTRLApp/Models/AppState.swift
          grep -F 'appState.startOwnerControl()' iCTRLApp/Views/SettingsView.swift
          grep -F 'appState.stopOwnerControl()' iCTRLApp/Views/SettingsView.swift
          if grep -F 'appState.startServer()' iCTRLApp/Views/SettingsView.swift; then
            echo "Production UI bypasses Owner ARM ingress"
            exit 1
          fi
          if grep -F 'appState.stopServer()' iCTRLApp/Views/SettingsView.swift; then
            echo "Production UI bypasses Owner OFF ingress"
            exit 1
          fi
          grep -F 'client.off' iCTRLApp/Models/AppState.swift
          grep -F 'self.stopServer()' iCTRLApp/Models/AppState.swift
          grep -F 'appendingPathComponent("owner")' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'appendingPathComponent("authority")' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'Authorization' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'KeychainStore.save' iCTRLApp/Models/OwnerControlClient.swift
          grep -F 'owner_control_provision' iCTRLApp/Models/AppState.swift
          if grep -R -n -E 'ICTRL_OWNER_CONTROL_TOKEN|ICTRLOwnerControlToken' iCTRLApp iCTRLKit Config; then
            echo "Owner-control credential embedded in source/build config"
            exit 1
          fi

      - name: Build unsigned release IPAs
        shell: bash
        run: |
          set +e
          make ipa UNSIGNED=1
          rc=$?
          set -e
          if [[ -f release/iCTRLUITests-Runner.ipa ]]; then
            echo "Runner release IPA is ready; normal-app release packaging may fail independently."
            exit 0
          fi
          exit "$rc"

      - name: Require ZERO-XCTEST Companion IPA
        run: test -f release/iCTRL.ipa

      - name: Upload iCTRL Runner IPA
        uses: actions/upload-artifact@v4
        with:
          name: iCTRLUITests-Runner-unsigned
          path: release/iCTRLUITests-Runner.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload ZERO-XCTEST Companion IPA
        uses: actions/upload-artifact@v4
        with:
          name: iCTRL-zero-xctest-companion-unsigned
          path: release/iCTRL.ipa
          if-no-files-found: error
          retention-days: 14
