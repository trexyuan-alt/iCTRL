name: Build unsigned iCTRL Runner

on:
  push:
    branches:
      - iphone-endpoint-oracle-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runner:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned release IPAs
        run: make ipa UNSIGNED=1

      - name: Upload iCTRL Runner IPA
        uses: actions/upload-artifact@v4
        with:
          name: iCTRLUITests-Runner-unsigned
          path: release/iCTRLUITests-Runner.ipa
          if-no-files-found: error
          retention-days: 14
